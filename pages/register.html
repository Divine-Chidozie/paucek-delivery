<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../styles/login.css" />
    <link rel="stylesheet" href="../styles/register.css" />
    <link rel="stylesheet" href="../styles/registerquerie.css" />

    <title>Create Account | Paucek Deliveries</title>
  </head>

  <body>
    <main class="container">
      <section class="form-container" aria-labelledby="register-heading">
        <a
          class="brand"
          href="../index.html"
          aria-label="Paucek Deliveries homepage"
        >
          <span class="brand-mark">P</span>
          <span>Paucek <strong>Deliveries</strong></span>
        </a>

        <div class="form-heading">
          <h1 id="register-heading">Create your account</h1>
          <p>Get started with Paucek Deliveries.</p>
        </div>

        <form id="registration-form" novalidate>
          <fieldset class="account-type-container">
            <legend>I'm creating an account as</legend>

            <div class="account-options">
              <label class="account-option">
                <input
                  type="radio"
                  name="accountType"
                  value="merchant"
                  required
                />
                <span>Vendor</span>
              </label>

              <label class="account-option">
                <input type="radio" name="accountType" value="rider" required />
                <span>Rider</span>
              </label>
            </div>

            <span
              id="account-type-error"
              class="field-error"
              aria-live="polite"
            ></span>
          </fieldset>

          <button class="google-btn" id="google-sign-up" type="button">
            <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
              <path
                fill="#EA4335"
                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"
              />
              <path
                fill="#4285F4"
                d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.73 7.18l7.64 5.93c4.46-4.12 7.13-10.2 7.13-17.58Z"
              />
              <path
                fill="#FBBC05"
                d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.93 23.93 0 0 0 0 24c0 3.87.93 7.52 2.56 10.78l7.97-6.19Z"
              />
              <path
                fill="#34A853"
                d="M24 48c6.48 0 11.93-2.13 15.91-5.87l-7.64-5.93c-2.12 1.42-4.84 2.27-8.27 2.27-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"
              />
            </svg>
            <span>Sign up with Google</span>
          </button>

          <div class="auth-divider" aria-hidden="true">
            <span></span>
            <p>OR SIGN UP WITH EMAIL</p>
            <span></span>
          </div>

          <div class="form-field">
            <label for="firstname">First name</label>
            <input
              id="firstname"
              type="text"
              name="firstname"
              placeholder="Enter your first name"
              autocomplete="given-name"
              required
            />
            <span
              id="firstname-error"
              class="field-error"
              aria-live="polite"
            ></span>
          </div>

          <div class="form-field">
            <label for="lastname">Last name</label>
            <input
              id="lastname"
              type="text"
              name="lastname"
              placeholder="Enter your last name"
              autocomplete="family-name"
              required
            />
            <span
              id="lastname-error"
              class="field-error"
              aria-live="polite"
            ></span>
          </div>

          <div class="form-field">
            <label for="email">Email address</label>
            <input
              id="email"
              type="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
            <span
              id="email-error"
              class="field-error"
              aria-live="polite"
            ></span>
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input
                id="password"
                type="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="8"
                required
              />
              <button
                type="button"
                class="password-toggle"
                data-target="password"
                aria-controls="password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>
            <span class="field-hint">Use at least 8 characters.</span>
            <span
              id="error-password"
              class="field-error"
              aria-live="polite"
            ></span>
          </div>

          <div class="form-field">
            <label for="confirm-password">Confirm password</label>
            <div class="password-wrapper">
              <input
                id="confirm-password"
                type="password"
                name="confirmPassword"
                placeholder="Enter your password again"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="password-toggle"
                data-target="confirm-password"
                aria-controls="confirm-password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>
            <span
              id="confirm-password-error"
              class="field-error"
              aria-live="polite"
            ></span>
          </div>

          <div class="terms-field">
            <label class="terms-label" for="terms">
              <input id="terms" type="checkbox" name="terms" required />
              <span>I agree to the terms and conditions.</span>
            </label>
            <span
              id="terms-error"
              class="field-error"
              aria-live="polite"
            ></span>
          </div>

          <p id="register-message" class="form-message" aria-live="polite"></p>

          <button class="btn btn-primary" type="submit">Create Account</button>
        </form>

        <p class="register">
          Already have an account?
          <a class="register-link" href="./login.html">Log in</a>
        </p>

        <a class="back-home" href="../index.html"> &larr; Back to homepage </a>
      </section>
    </main>

    <script src="../scripts/register.js"></script>
  </body>
</html>
