<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../styles/login.css" />
    <link rel="stylesheet" href="../styles/loginquerie.css" />

    <title>Log In | Paucek Deliveries</title>
  </head>

  <body>
    <main class="container">
      <section class="form-container" aria-labelledby="login-heading">
        <a
          class="brand"
          href="../index.html"
          aria-label="Paucek Deliveries homepage"
        >
          <span class="brand-mark">P</span>
          <span>Paucek <strong>Deliveries</strong></span>
        </a>

        <div class="form-heading">
          <h1 id="login-heading">Welcome back!</h1>
          <p>Log in to manage your deliveries.</p>
        </div>

        <form id="my-form" novalidate>
          <fieldset class="account-type-container">
            <legend>I'm logging in as</legend>

            <div class="account-options">
              <label class="account-option">
                <input
                  type="radio"
                  name="accountType"
                  value="merchant"
                  required
                />
                <span>Vendor</span>
              </label>

              <label class="account-option">
                <input type="radio" name="accountType" value="rider" required />
                <span>Rider</span>
              </label>
            </div>

            <span
              id="account-type-error"
              class="field-error"
              aria-live="polite"
            ></span>
          </fieldset>

          <button class="google-btn" type="button" id="google-sign-in">
            <svg
              class="google-icon"
              viewBox="0 0 48 48"
              aria-hidden="true"
              focusable="false"
            >
              <path
                fill="#EA4335"
                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"
                transform="translate(0 5)"
              />
              <path
                fill="#4285F4"
                d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.76 7.18l7.73 6C44.42 37.94 46.98 31.7 46.98 24.55Z"
              />
              <path
                fill="#FBBC05"
                d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.2A23.8 23.8 0 0 0 0 24c0 3.87.93 7.55 2.56 10.78l7.97-6.19Z"
                transform="translate(0 5)"
              />
              <path
                fill="#34A853"
                d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.14 1.45-4.88 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"
              />
            </svg>
            <span>Continue with Google</span>
          </button>

          <div class="auth-divider" aria-hidden="true">
            <span></span>
            <p>OR CONTINUE WITH EMAIL</p>
            <span></span>
          </div>

          <div class="form-field">
            <label for="email">Email address</label>
            <input
              id="email"
              type="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              aria-describedby="email-error"
              required
            />
            <span
              id="email-error"
              class="field-error"
              aria-live="polite"
            ></span>
          </div>

          <div class="form-field">
            <div class="label-row">
              <label for="password">Password</label>
              <a class="forgot-password" href="#" id="forgot-password">
                Forgot password?
              </a>
            </div>

            <div class="password-wrapper">
              <input
                id="password"
                type="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                aria-describedby="password-error"
                required
              />
              <button
                type="button"
                id="togglePassword"
                aria-controls="password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>

            <span
              id="password-error"
              class="field-error"
              aria-live="polite"
            ></span>
          </div>

          <p
            id="form-message"
            class="form-message"
            role="status"
            aria-live="polite"
          ></p>

          <button class="btn btn-primary" type="submit">Log In</button>
        </form>

        <p class="register">
          Don't have an account?
          <a class="register-link" href="./register.html">Create account</a>
        </p>

        <a class="back-home" href="../index.html"> &larr; Back to homepage </a>
      </section>
    </main>

    <script src="../scripts/login.js"></script>
  </body>
</html>
